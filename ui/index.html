<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Amharic → English Text | Neo‑Brutalist Converter</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="/eel.js"></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="neo-bg"></div>
    <main class="neo-container">
        <div class="neo-card">
            <div class="brand-header">
                <div class="icon-badge">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z" fill="currentColor"/>
                    </svg>
                </div>
                <div class="title-section">
                    <h1>Amharic → English Text</h1>
                    <p class="subhead">Bold transliteration · offline · pure text</p>
                    <div class="offline-badge">⚡ no internet · instant</div>
                </div>
            </div>

            <div class="input-field-group">
                <div class="field-label">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 19V5M5 12h14" stroke="currentColor" stroke-linecap="round"/>
                    </svg>
                    <span>Amharic text</span>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="inputText" rows="5" placeholder="ለምሳሌ፡ ሰላም ልጅ እንዴት ነህ? ዛሬ ስራህ እንዴት ነው?"></textarea>
                </div>
                <div class="input-utilities">
                    <div class="char-counter">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 8v4l3 3" stroke="currentColor"/>
                        </svg>
                        <span id="charCount">0</span> <span>characters</span>
                    </div>
                    <button id="clearInputBtn" class="utility-btn" title="Clear text">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor"/>
                            <path d="M10 11v5M14 11v5" stroke="currentColor"/>
                        </svg>
                        <span>Clear</span>
                    </button>
                </div>
            </div>

            <div class="action-row">
                <button id="convertBtn" class="btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12h3l3-9 3 18 3-9h3" stroke="currentColor" stroke-linecap="round"/>
                    </svg>
                    <span>Convert to English</span>
                </button>
                <button id="exampleBtn" class="btn-secondary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-linecap="round"/>
                    </svg>
                    <span>Example</span>
                </button>
            </div>

            <div class="output-section">
                <div class="output-header">
                    <div class="output-title">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor"/>
                        </svg>
                        <h3>English output</h3>
                    </div>
                    <button id="copyBtn" class="copy-btn" disabled>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor"/>
                        </svg>
                        <span>Copy</span>
                    </button>
                </div>
                <div id="output" class="output-box">
                    <div class="output-placeholder">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M20 12H4M12 4v16" stroke="currentColor"/>
                        </svg>
                        <span>Your English phonetic text will appear here</span>
                    </div>
                </div>
            </div>

            <div class="footer-note">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 6v6l4 2" stroke="currentColor"/>
                    <circle cx="12" cy="12" r="10"/>
                </svg>
                <span>local Python backend · text only</span>
            </div>
        </div>
    </main>
</body>
</html>
